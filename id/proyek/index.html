<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101110" />
    <meta
      name="description"
      content="Portofolio Andika Pramana, fullstack developer dengan lima tahun pengalaman IT. Jelajahi proyek web, aplikasi mobile, dan diskusikan ide proyek Anda."
    />
    <title>Semua proyek — Andika Pramana</title>
    <script src="../../theme.js"></script>
    <link rel="stylesheet" href="../../style.css" />
    <script>
      try {
        localStorage.setItem("dkpr-language", document.documentElement.lang);
      } catch {}
    </script>
  </head>
  <body>
    <header>
      <div class="wrap nav">
        <a class="brand" href="../#beranda" aria-label="DKPR Beranda"><b>DKPR</b><i>.</i></a>
        <nav>
          <a href="../#beranda">Beranda</a><a href="../#tentang">Tentang</a
          ><a class="active" aria-current="page" href="./">Proyek</a>
        </nav>
        <div class="nav-tools">
          <button
            type="button"
            class="theme-switch"
            aria-label="Mode gelap"
            title="Mode gelap"
            aria-pressed="false"
          >
            <svg
              aria-hidden="true"
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <g class="sun">
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
                />
              </g>
              <path class="moon" d="M20.5 14.4A9 9 0 0 1 9.6 3.5a9 9 0 1 0 10.9 10.9Z" />
            </svg>
          </button>
          <div class="languages" role="group" aria-label="Bahasa">
            <a href="./" lang="id" hreflang="id" aria-label="Bahasa Indonesia" aria-current="true"
              >ID</a
            ><a href="../../en/projects/" lang="en" hreflang="en" aria-label="English">EN</a>
          </div>
          <a class="contactbtn" href="../#kontak">Hubungi saya <span aria-hidden="true">✳</span></a>
        </div>
      </div>
    </header>
    <main class="wrap catalog">
      <div class="sectionhead">
        <h1>Semua proyek<span>.</span></h1>
        <span class="mono" id="project-count"></span>
      </div>
      <div class="cards" id="cards"></div>
      <nav id="pagination" aria-label="Halaman proyek"><span id="page-state"></span></nav>
    </main>
    <footer class="wrap">
      <a class="brand" href="../#beranda"><b>DKPR</b><i>.</i></a
      ><span>© 2026 Andika Pramana</span>
    </footer>
    <dialog id="detail">
      <button class="close" aria-label="Tutup">×</button>
      <div id="bodydetail"></div>
    </dialog>
    <script src="../../id.js"></script>
    <script src="../../projects.js"></script>
  </body>
</html>
